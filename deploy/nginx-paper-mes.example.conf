# This file is normally included from nginx.conf inside the http {} block.
# Keep the zone name site-specific so other apps on the same server are not affected.
limit_req_zone $binary_remote_addr zone=paper_mes_login:10m rate=10r/m;

map $uri $paper_mes_cache_control {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
    /index.html "no-store, no-cache, must-revalidate";
}

server {
    listen 80;
    server_name mes.example.com;

    root /opt/paper-mes/frontend/dist;
    index index.html;

    client_max_body_size 50m;

    # Keep compression scoped to MES so other sites on the shared host are not
    # affected by this application's response policy.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control $paper_mes_cache_control;

    # Hashed assets must never fall back to index.html. Old cached bundles then
    # fail predictably rather than loading HTML as CSS or JavaScript.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # Deployments replace index.html, so clients must never cache it.
    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/login {
        limit_req zone=paper_mes_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
