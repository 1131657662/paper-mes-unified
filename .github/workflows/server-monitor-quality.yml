name: Server monitor quality

on:
  pull_request:
    paths:
      - "deploy/*monitor-server*"
      - "deploy/server-monitor*"
      - "deploy/notify-server-monitor-internal.example.sh"
      - "deploy/test-notify-server-monitor-internal.sh"
      - "deploy/send-paper-mes-alert-email.example.sh"
      - "deploy/test-send-paper-mes-alert-email.sh"
      - "deploy/*server-daily-report*"
      - "deploy/server_daily_report_*.py"
      - "deploy/daily-report.env.example"
      - "deploy/*offsite*"
      - "deploy/*sync*backup*"
      - "deploy/backup-paper-mes.example.sh"
      - "deploy/test-backup-paper-mes.sh"
      - "deploy/verify-backup-restore.example.sh"
      - "deploy/*backup*verify*"
      - "deploy/verify-paper-mes-backup-root.example.sh"
      - "deploy/backup-restore.env.example"
      - "deploy/backup.env.example"
      - "deploy/paper-mes-backup.cron.example"
      - "src/main/java/com/paper/mes/backup/**"
      - "src/main/resources/application.yml"
      - "src/test/java/com/paper/mes/backup/service/BackupCommandRunnerLinuxTest.java"
      - "src/test/java/com/paper/mes/backup/service/BackupRuntimeResolverTest.java"
      - "src/test/java/com/paper/mes/safety/BackupRootVerificationSecurityContractTest.java"
      - "src/test/java/com/paper/mes/safety/HealthMonitoringContractTest.java"
      - "src/test/java/com/paper/mes/safety/OffsiteBackupSyncContractTest.java"
      - "src/test/java/com/paper/mes/safety/RestoreVerificationScriptContractTest.java"
      - "docs/生产部署指南.md"
      - ".github/workflows/server-monitor-quality.yml"
  push:
    branches: [main]
    paths:
      - "deploy/*monitor-server*"
      - "deploy/server-monitor*"
      - "deploy/notify-server-monitor-internal.example.sh"
      - "deploy/test-notify-server-monitor-internal.sh"
      - "deploy/send-paper-mes-alert-email.example.sh"
      - "deploy/test-send-paper-mes-alert-email.sh"
      - "deploy/*server-daily-report*"
      - "deploy/server_daily_report_*.py"
      - "deploy/daily-report.env.example"
      - "deploy/*offsite*"
      - "deploy/*sync*backup*"
      - "deploy/backup-paper-mes.example.sh"
      - "deploy/test-backup-paper-mes.sh"
      - "deploy/verify-backup-restore.example.sh"
      - "deploy/*backup*verify*"
      - "deploy/verify-paper-mes-backup-root.example.sh"
      - "deploy/backup-restore.env.example"
      - "deploy/backup.env.example"
      - "deploy/paper-mes-backup.cron.example"
      - "src/main/java/com/paper/mes/backup/**"
      - "src/main/resources/application.yml"
      - "src/test/java/com/paper/mes/backup/service/BackupCommandRunnerLinuxTest.java"
      - "src/test/java/com/paper/mes/backup/service/BackupRuntimeResolverTest.java"
      - "src/test/java/com/paper/mes/safety/BackupRootVerificationSecurityContractTest.java"
      - "src/test/java/com/paper/mes/safety/HealthMonitoringContractTest.java"
      - "src/test/java/com/paper/mes/safety/OffsiteBackupSyncContractTest.java"
      - "src/test/java/com/paper/mes/safety/RestoreVerificationScriptContractTest.java"
      - "docs/生产部署指南.md"
      - ".github/workflows/server-monitor-quality.yml"

concurrency:
  group: server-monitor-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash -n deploy/verify-paper-mes-backup-root.example.sh deploy/install-paper-mes-backup-verify-root.example.sh
      - run: bash deploy/test-backup-paper-mes.sh
      - run: bash deploy/test-sync-backups-rclone.sh
      - run: bash deploy/test-sync-offsite-backups.sh
      - run: bash deploy/test-prune-offsite-backups.sh
      - run: bash deploy/test-check-offsite-backup-capacity.sh
      - run: bash deploy/test-monitor-server.sh
      - run: bash deploy/test-notify-server-monitor-internal.sh
      - run: bash deploy/test-send-paper-mes-alert-email.sh
      - run: python3 deploy/test-server-daily-report.py
      - run: bash deploy/test-server-daily-report-delivery.sh
      - uses: actions/setup-java@v5
        with:
          cache: maven
          distribution: temurin
          java-version: 21
      - run: sh mvnw -q '-Dtest=HealthMonitoringContractTest,OffsiteBackupSyncContractTest,RestoreVerificationScriptContractTest,BackupRootVerificationSecurityContractTest,BackupRuntimeResolverTest,BackupCommandRunnerLinuxTest' test
