name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "pom.xml"
      - "src/main/**"
      - "src/test/java/com/paper/mes/openapi/**"
      - "deploy/nginx-paper-mes.example.conf"
      - "deploy/nginx-paper-mes-https.example.conf"
      - "deploy/test-nginx-paper-mes-config.sh"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "pom.xml"
      - "src/main/**"
      - "src/test/java/com/paper/mes/openapi/**"
      - "deploy/nginx-paper-mes.example.conf"
      - "deploy/nginx-paper-mes-https.example.conf"
      - "deploy/test-nginx-paper-mes-config.sh"
      - ".github/workflows/frontend-quality.yml"

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      PAPER_MES_E2E_BASE_URL: ${{ secrets.PAPER_MES_E2E_BASE_URL }}
      PAPER_MES_E2E_LIMITED_PASSWORD: ${{ secrets.PAPER_MES_E2E_LIMITED_PASSWORD }}
      PAPER_MES_E2E_LIMITED_USERNAME: ${{ secrets.PAPER_MES_E2E_LIMITED_USERNAME }}
      PAPER_MES_E2E_PASSWORD: ${{ secrets.PAPER_MES_E2E_PASSWORD }}
      PAPER_MES_E2E_USERNAME: ${{ secrets.PAPER_MES_E2E_USERNAME }}

    steps:
      - uses: actions/checkout@v5

      - run: bash deploy/test-nginx-paper-mes-config.sh
        working-directory: .

      - uses: actions/setup-java@v5
        with:
          cache: maven
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          node-version: 22

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run openapi:check
      - run: sh mvnw -q -Dtest=RumRateLimiterTest test
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:dependencies
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:performance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: process-order-performance-${{ github.run_id }}
          path: frontend/test-results/performance
          if-no-files-found: ignore
      - run: node scripts/run-lighthouse-ci.mjs
