name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "pom.xml"
      - "src/main/**"
      - "src/test/java/com/paper/mes/openapi/**"
      - "src/test/java/com/paper/mes/ai/**"
      - "src/test/java/com/paper/mes/integration/**"
      - "sql/**"
      - "deploy/apply-paper-mes-migrations.example.sh"
      - "deploy/migration-lock-support.sh"
      - "deploy/migration-state-support.sh"
      - "deploy/verify-paper-mes-migration-state.example.sh"
      - "deploy/check-ai-rules.sh"
      - "deploy/preflight-paper-mes-release.example.sh"
      - "deploy/test-preflight-paper-mes-release.sh"
      - "deploy/nginx-paper-mes.example.conf"
      - "deploy/nginx-paper-mes-https.example.conf"
      - "deploy/test-nginx-paper-mes-config.sh"
      - "deploy/deploy-paper-mes.example.sh"
      - "deploy/paper-mes-runtime-rollback.example.sh"
      - "deploy/deploy-paper-mes-test.example.sh"
      - "deploy/paper-mes-test-deploy-wrapper.example.sh"
      - ".github/workflows/deploy-mes-test.yml"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "pom.xml"
      - "src/main/**"
      - "src/test/java/com/paper/mes/openapi/**"
      - "src/test/java/com/paper/mes/ai/**"
      - "src/test/java/com/paper/mes/integration/**"
      - "sql/**"
      - "deploy/apply-paper-mes-migrations.example.sh"
      - "deploy/migration-lock-support.sh"
      - "deploy/migration-state-support.sh"
      - "deploy/verify-paper-mes-migration-state.example.sh"
      - "deploy/check-ai-rules.sh"
      - "deploy/preflight-paper-mes-release.example.sh"
      - "deploy/test-preflight-paper-mes-release.sh"
      - "deploy/nginx-paper-mes.example.conf"
      - "deploy/nginx-paper-mes-https.example.conf"
      - "deploy/test-nginx-paper-mes-config.sh"
      - "deploy/deploy-paper-mes.example.sh"
      - "deploy/paper-mes-runtime-rollback.example.sh"
      - "deploy/deploy-paper-mes-test.example.sh"
      - "deploy/paper-mes-test-deploy-wrapper.example.sh"
      - ".github/workflows/deploy-mes-test.yml"
      - ".github/workflows/frontend-quality.yml"

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - run: bash deploy/test-nginx-paper-mes-config.sh
        working-directory: .
      - run: bash -n deploy/deploy-paper-mes.example.sh deploy/paper-mes-runtime-rollback.example.sh deploy/deploy-paper-mes-test.example.sh deploy/paper-mes-test-deploy-wrapper.example.sh deploy/verify-paper-mes-process-route-schema.example.sh
        working-directory: .

      - uses: actions/setup-java@v5
        with:
          cache: maven
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          node-version: 22

      - run: npm ci
      # Production dependencies remain a release gate. Lighthouse CI currently pulls
      # extract-zip@2.0.1 through Puppeteer; upstream has no patched release yet.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
      - run: bash deploy/check-ai-rules.sh
        working-directory: .
      - run: npm run openapi:check
      - run: sh mvnw -q '-Dtest=RumRateLimiterTest,PermissionsTest,Ai*Test,BackupRootVerificationSecurityContractTest,BackupRuntimeResolverTest,BackupCommandRunnerLinuxTest,ProductionDeploymentSecurityContractTest' test
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:dependencies
      # ubuntu-latest already supplies the shared browser libraries. Installing
      # apt dependencies on every run can consume the entire 30-minute job limit.
      - run: npx playwright install chromium
      # Keep the quality gate hermetic. Authenticated and deployed-environment
      # probes belong to the controlled test-deployment acceptance stage.
      - run: npm run test:e2e
      - run: npm run test:e2e:performance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: process-order-performance-${{ github.run_id }}
          path: frontend/test-results/performance
          if-no-files-found: ignore
      - run: node scripts/run-lighthouse-ci.mjs
