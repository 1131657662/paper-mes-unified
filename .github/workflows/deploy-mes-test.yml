name: Deploy MES test

on:
  workflow_run:
    workflows: ["Frontend quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Full main commit SHA to deploy after CI verification"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-mes-test
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: mes-test
      url: https://mes-test.nbsmzwl.cn
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.deploy_sha }}

    steps:
      - name: Prepare pinned SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MES_TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MES_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "MES_TEST_SSH_PRIVATE_KEY is missing" >&2; exit 1; }
          test -n "${SSH_KNOWN_HOSTS}" || { echo "MES_TEST_SSH_KNOWN_HOSTS is missing" >&2; exit 1; }
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

      - name: Deploy the checked commit to test only
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MES_TEST_SSH_HOST }}
          SSH_USER: ${{ secrets.MES_TEST_SSH_USER }}
        run: |
          set -Eeuo pipefail
          test -n "${SSH_HOST}" || { echo "MES_TEST_SSH_HOST is missing" >&2; exit 1; }
          test -n "${SSH_USER}" || { echo "MES_TEST_SSH_USER is missing" >&2; exit 1; }
          ssh -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "sudo -n /usr/local/sbin/paper-mes-test-deploy '${DEPLOY_SHA}'"

      - name: Verify public test endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 15 https://mes-test.nbsmzwl.cn/ > /tmp/mes-test-index.html
          grep -q '<title>纸品智造 MES</title>' /tmp/mes-test-index.html
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://mes-test.nbsmzwl.cn/api/auth/me)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://mes-test.nbsmzwl.cn/actuator/health)" = 404
