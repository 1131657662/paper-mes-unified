server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: paper-mes
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false
  packages-to-scan: com.paper.mes
  paths-to-match: /api/**
  writer-with-order-by-keys: true

app:
  ai:
    data-mode: ${PAPER_MES_AI_DATA_MODE:DISABLED}
    process-dialogue-v2-enabled: ${PAPER_MES_AI_PROCESS_DIALOGUE_V2:false}
    process-dialogue-v2-order-allowlist: ${PAPER_MES_AI_PROCESS_DIALOGUE_V2_ORDERS:}
    process-dialogue-v2-user-allowlist: ${PAPER_MES_AI_PROCESS_DIALOGUE_V2_USERS:}
    provider: ${PAPER_MES_AI_PROVIDER:LOCAL_RULES}
    rules-resource: ${PAPER_MES_AI_RULES_RESOURCE:classpath:ai/rules-v1.0.0.json}
    memory-dir: ${PAPER_MES_AI_MEMORY_DIR:/etc/paper-mes/ai-memory}
    memory-seed-resource: ${PAPER_MES_AI_MEMORY_SEED_RESOURCE:classpath:ai/project-memory.seed.v1.json}
    message-encryption-key: ${PAPER_MES_AI_MESSAGE_ENCRYPTION_KEY:}
    config-master-key: ${PAPER_MES_AI_CONFIG_MASTER_KEY:}
    memory-reference-hmac-key: ${PAPER_MES_AI_MEMORY_REFERENCE_HMAC_KEY:}
    memory-cache-poll-ms: ${PAPER_MES_AI_MEMORY_CACHE_POLL_MS:60000}
    max-question-chars: ${PAPER_MES_AI_MAX_QUESTION_CHARS:1000}
    global-concurrent-requests: ${PAPER_MES_AI_GLOBAL_CONCURRENT_REQUESTS:1}
    memory-candidate-min-orders: ${PAPER_MES_AI_MEMORY_CANDIDATE_MIN_ORDERS:5}
    memory-candidate-window-days: ${PAPER_MES_AI_MEMORY_CANDIDATE_WINDOW_DAYS:7}
    memory-candidate-ttl-days: ${PAPER_MES_AI_MEMORY_CANDIDATE_TTL_DAYS:90}
    memory-evidence-audit-retention-days: ${PAPER_MES_AI_MEMORY_EVIDENCE_AUDIT_RETENTION_DAYS:90}
    memory-learning-processing-timeout-minutes: ${PAPER_MES_AI_MEMORY_LEARNING_PROCESSING_TIMEOUT_MINUTES:10}
    deepseek-api-key: ${PAPER_MES_AI_DEEPSEEK_API_KEY:}
    deepseek-model-pro: ${PAPER_MES_AI_DEEPSEEK_MODEL_PRO:deepseek-v4-pro}
    deepseek-model-flash: ${PAPER_MES_AI_DEEPSEEK_MODEL_FLASH:deepseek-v4-flash}
    deepseek-base-url: ${PAPER_MES_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
    deepseek-connect-timeout-ms: ${PAPER_MES_AI_DEEPSEEK_CONNECT_TIMEOUT_MS:3000}
    deepseek-read-timeout-ms: ${PAPER_MES_AI_DEEPSEEK_READ_TIMEOUT_MS:120000}
    deepseek-max-output-tokens: ${PAPER_MES_AI_DEEPSEEK_MAX_OUTPUT_TOKENS:4000}
    provider-max-attempts: ${PAPER_MES_AI_PROVIDER_MAX_ATTEMPTS:2}
    provider-retry-backoff-ms: ${PAPER_MES_AI_PROVIDER_RETRY_BACKOFF_MS:250}
    provider-circuit-failure-threshold: ${PAPER_MES_AI_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:3}
    provider-circuit-open-seconds: ${PAPER_MES_AI_PROVIDER_CIRCUIT_OPEN_SECONDS:30}
    conversation-cleanup-delay-ms: ${PAPER_MES_AI_CONVERSATION_CLEANUP_DELAY_MS:60000}
    default-target-diameter-mm: ${PAPER_MES_AI_DEFAULT_TARGET_DIAMETER_MM:1200}
    zhipu-api-key: ${PAPER_MES_AI_ZHIPU_API_KEY:}
    zhipu-model: ${PAPER_MES_AI_ZHIPU_MODEL:glm-4.7-flash}
    zhipu-base-url: ${PAPER_MES_AI_ZHIPU_BASE_URL:https://open.bigmodel.cn}
    zhipu-connect-timeout-ms: ${PAPER_MES_AI_ZHIPU_CONNECT_TIMEOUT_MS:1000}
    zhipu-read-timeout-ms: ${PAPER_MES_AI_ZHIPU_READ_TIMEOUT_MS:8000}
    zhipu-max-output-tokens: ${PAPER_MES_AI_ZHIPU_MAX_OUTPUT_TOKENS:1000}
  rum:
    enabled: ${PAPER_MES_RUM_ENABLED:false}
    max-events-per-minute: ${PAPER_MES_RUM_MAX_EVENTS_PER_MINUTE:300}
    max-tracked-clients: ${PAPER_MES_RUM_MAX_TRACKED_CLIENTS:10000}
  schema-bootstrap:
    enabled: ${PAPER_MES_SCHEMA_BOOTSTRAP_ENABLED:false}
  schema-readiness:
    expected-version: ${PAPER_MES_EXPECTED_SCHEMA_VERSION:3.76}
    require-migration-history: ${PAPER_MES_REQUIRE_MIGRATION_HISTORY:false}
  runtime:
    backend-version: ${PAPER_MES_BACKEND_VERSION:dev}
    frontend-version: ${PAPER_MES_FRONTEND_VERSION:dev}
    git-sha: ${PAPER_MES_GIT_SHA:unknown}
    build-time: ${PAPER_MES_BUILD_TIME:unknown}
  auth:
    session-hours: ${PAPER_MES_SESSION_HOURS:12}
    session-retention-days: ${PAPER_MES_SESSION_RETENTION_DAYS:7}
    session-cleanup-cron: "${PAPER_MES_SESSION_CLEANUP_CRON:0 30 3 * * *}"
    login-max-failures: ${PAPER_MES_LOGIN_MAX_FAILURES:5}
    login-window-seconds: ${PAPER_MES_LOGIN_WINDOW_SECONDS:300}
    login-lock-seconds: ${PAPER_MES_LOGIN_LOCK_SECONDS:900}
    cookie-secure: ${PAPER_MES_COOKIE_SECURE:false}
  data-health:
    back-record-overdue-days: ${PAPER_MES_BACK_RECORD_OVERDUE_DAYS:3}
    receivable-overdue-days: ${PAPER_MES_RECEIVABLE_OVERDUE_DAYS:30}
    initial-delay-ms: ${PAPER_MES_DATA_HEALTH_INITIAL_DELAY_MS:60000}
    scan-delay-ms: ${PAPER_MES_DATA_HEALTH_SCAN_DELAY_MS:900000}
  export-task:
    storage-dir: ${PAPER_MES_EXPORT_STORAGE_DIR:./data/exports}
    storage-min-free-bytes: ${PAPER_MES_EXPORT_MIN_FREE_BYTES:0}
    storage-min-free-percent: ${PAPER_MES_EXPORT_MIN_FREE_PERCENT:5}
    storage-alert-initial-delay-ms: ${PAPER_MES_EXPORT_ALERT_INITIAL_DELAY_MS:30000}
    storage-alert-check-delay-ms: ${PAPER_MES_EXPORT_ALERT_CHECK_DELAY_MS:60000}
    stale-minutes: ${PAPER_MES_EXPORT_STALE_MINUTES:10}
    heartbeat-interval-seconds: ${PAPER_MES_EXPORT_HEARTBEAT_INTERVAL_SECONDS:30}
    orphan-retention-minutes: ${PAPER_MES_EXPORT_ORPHAN_RETENTION_MINUTES:60}
    orphan-scan-limit: ${PAPER_MES_EXPORT_ORPHAN_SCAN_LIMIT:100}
    orphan-cleanup-initial-delay-ms: ${PAPER_MES_EXPORT_ORPHAN_CLEANUP_INITIAL_DELAY_MS:60000}
    orphan-cleanup-delay-ms: ${PAPER_MES_EXPORT_ORPHAN_CLEANUP_DELAY_MS:900000}
    sse-sync-delay-ms: ${PAPER_MES_EXPORT_SSE_SYNC_DELAY_MS:2000}
    executor:
      worker-count: ${PAPER_MES_EXPORT_WORKER_COUNT:2}
      queue-capacity: ${PAPER_MES_EXPORT_QUEUE_CAPACITY:50}
      shutdown-wait-seconds: ${PAPER_MES_EXPORT_SHUTDOWN_WAIT_SECONDS:5}
  upload:
    dir: ./upload
    url-prefix: /api/files
  remain:
    enabled: ${PAPER_MES_REMAIN_ENABLED:false}
  backup:
    enabled: ${PAPER_MES_BACKUP_ENABLED:true}
    root-dir: ${PAPER_MES_BACKUP_ROOT:}
    backup-script: ${PAPER_MES_BACKUP_SCRIPT:}
    verify-script: ${PAPER_MES_VERIFY_SCRIPT:}
    verify-wrapper: ${PAPER_MES_BACKUP_VERIFY_WRAPPER:}
    env-file: ${PAPER_MES_BACKUP_ENV_FILE:}
    source-db-name: ${PAPER_MES_DB_NAME:paper_processing}
    command-timeout: ${PAPER_MES_BACKUP_TIMEOUT:30m}
    cleanup-cron: "${PAPER_MES_BACKUP_CLEANUP_CRON:0 15 3 * * *}"
    automatic-check-delay: ${PAPER_MES_BACKUP_CHECK_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,schemaReadiness

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-system}]"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
