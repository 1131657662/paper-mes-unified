server:
  address: 127.0.0.1
  port: 8081
  servlet:
    context-path: /
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PAPER_MES_DB_URL:jdbc:mysql://127.0.0.1:3306/paper_processing?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=false}
    username: ${PAPER_MES_DB_USER:paper_mes_app}
    password: ${PAPER_MES_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  ai:
    data-mode: ${PAPER_MES_AI_DATA_MODE:DISABLED}
    provider: ${PAPER_MES_AI_PROVIDER:LOCAL_RULES}
    rules-resource: ${PAPER_MES_AI_RULES_RESOURCE:classpath:ai/rules-v1.0.0.json}
    max-question-chars: ${PAPER_MES_AI_MAX_QUESTION_CHARS:1000}
    global-concurrent-requests: ${PAPER_MES_AI_GLOBAL_CONCURRENT_REQUESTS:1}
    zhipu-api-key: ${PAPER_MES_AI_ZHIPU_API_KEY:}
    zhipu-model: ${PAPER_MES_AI_ZHIPU_MODEL:glm-4.7-flash}
    zhipu-base-url: ${PAPER_MES_AI_ZHIPU_BASE_URL:https://open.bigmodel.cn}
    zhipu-connect-timeout-ms: ${PAPER_MES_AI_ZHIPU_CONNECT_TIMEOUT_MS:1000}
    zhipu-read-timeout-ms: ${PAPER_MES_AI_ZHIPU_READ_TIMEOUT_MS:8000}
    zhipu-max-output-tokens: ${PAPER_MES_AI_ZHIPU_MAX_OUTPUT_TOKENS:1000}
  rum:
    enabled: ${PAPER_MES_RUM_ENABLED:false}
    max-events-per-minute: ${PAPER_MES_RUM_MAX_EVENTS_PER_MINUTE:300}
    max-tracked-clients: ${PAPER_MES_RUM_MAX_TRACKED_CLIENTS:10000}
  schema-bootstrap:
    enabled: false
  schema-readiness:
    expected-version: ${PAPER_MES_EXPECTED_SCHEMA_VERSION:3.64}
    require-migration-history: true
  runtime:
    backend-version: ${PAPER_MES_BACKEND_VERSION}
    frontend-version: ${PAPER_MES_FRONTEND_VERSION}
    git-sha: ${PAPER_MES_GIT_SHA}
    build-time: ${PAPER_MES_BUILD_TIME}
  auth:
    session-hours: 12
    session-retention-days: 7
    session-cleanup-cron: "0 30 3 * * *"
    login-max-failures: 5
    login-window-seconds: 300
    login-lock-seconds: 900
    cookie-secure: true
  upload:
    dir: /opt/paper-mes/upload
    url-prefix: /api/files

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  file:
    name: /var/log/paper-mes/app.log
  level:
    root: INFO
    com.paper.mes: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
